<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOTBOX</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="top-column">
    <div class="logo-container">
      <img src="logo.png.png" alt="JOTBOX logo">
      <h1>JOTBOX</h1>
    </div>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="content-container" id="home">
    <aside class="left-pane">
      <button class="add-note-button" onclick="addNewNote()">+ Add Note</button>
      <div id="note-list"></div>
    </aside>

    <section class="right-pane">
      <div class="top-section">
        <div class="top-left">
          <img src="dustbin.png" alt="Delete current note" title="Delete current note"
               onclick="deleteCurrentNote()" class="button-image">
        </div>
        <div class="top-right">
          <img src="new.png" alt="Open GPT-2 text generator" title="Open GPT-2 text generator"
               onclick="openModal()" class="button-image">
        </div>
      </div>

      <div class="editor">
        <input type="text" id="note-title" placeholder="Enter note title..." aria-label="Note title">
        <textarea id="note-content" placeholder="Enter note content..." aria-label="Note content"></textarea>
        <button onclick="saveNote()">Save Note</button>
      </div>
    </section>
  </main>

  <div id="gpt2-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="gpt2-heading">
    <div class="modal-content">
      <span class="close" onclick="closeModal()" role="button" aria-label="Close">&times;</span>
      <h2 id="gpt2-heading">GPT-2 Model</h2>
      <textarea id="gpt2-input" placeholder="Enter your prompt..."></textarea>
      <button onclick="generateText()">Generate</button>
      <div id="gpt2-output" aria-live="polite"></div>
    </div>
  </div>
</body>
</html>
